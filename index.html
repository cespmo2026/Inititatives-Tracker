<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#eef5f0">
  <title>Internal Project Tracker — Sign in</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #1c2c3d;
      background: #eef5f0;
      font-synthesis: none;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(ellipse at 15% 10%, #d9eee0 0, transparent 34%),
        radial-gradient(ellipse at 90% 90%, #e1e8f5 0, transparent 32%),
        #f4f6f1;
    }
    main {
      width: min(440px, 100%);
      padding: 38px;
      border: 1px solid #e2e8df;
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 24px 70px rgba(32, 48, 60, .11);
    }
    .brand { display: flex; align-items: center; gap: 11px; margin-bottom: 35px; font-size: 20px; font-weight: 750; letter-spacing: -.6px; }
    .brand-mark { display: grid; width: 36px; height: 36px; place-items: center; border-radius: 12px; background: linear-gradient(140deg, #8197ea, #536bce); color: white; font-size: 18px; }
    .brand-logo { width: 42px; height: 42px; flex: 0 0 auto; object-fit: contain; border-radius: 9px; background: #fff; padding: 1px; }
    .eyebrow { margin: 0 0 9px; color: #287c64; font-size: 11px; font-weight: 750; letter-spacing: 1.4px; text-transform: uppercase; }
    h1 { margin: 0; font-size: 29px; letter-spacing: -1px; }
    .intro { margin: 10px 0 27px; color: #73808b; font-size: 14px; line-height: 1.6; }
    label { display: block; margin: 16px 0 7px; font-size: 13px; font-weight: 650; }
    input { width: 100%; min-height: 45px; padding: 11px 12px; border: 1px solid #dfe5df; border-radius: 9px; outline: none; background: #fbfcfa; color: #1c2c3d; font: inherit; }
    input:focus { border-color: #8295dc; box-shadow: 0 0 0 3px rgba(83, 107, 206, .12); }
    button { width: 100%; min-height: 45px; margin-top: 23px; border: 0; border-radius: 9px; background: #287c64; color: white; font: inherit; font-weight: 700; cursor: pointer; transition: background .15s ease; }
    button:hover { background: #216950; }
    button:disabled { cursor: wait; opacity: .7; }
    #signin-error { min-height: 20px; margin: 13px 0 0; color: #aa5552; font-size: 13px; line-height: 1.5; }
    .help { margin: 22px 0 0; color: #73808b; font-size: 12px; line-height: 1.6; }
    @media (max-width: 480px) { main { padding: 28px 23px; } }
  </style>
</head>
<body>
  <main>
    <div class="brand"><svg class="brand-logo" viewBox="0 0 225 225" role="img" aria-label="CES logo"><path fill="#00528b" d="M48 61 181 28c15-4 28 7 34 20 4 10 1 20-4 31l-42 83c-9 18-26 30-47 25l-91-20c-22-5-27-20-23-39l10-42c4-16 14-22 30-25Z"/><text x="42" y="143" fill="#fff" font-family="Arial,sans-serif" font-size="68" font-weight="700" letter-spacing="-4">CES</text><path fill="#f7941d" d="M99 149h28v8H99z"/></svg><span>Internal Project Tracker</span></div>
    <p class="eyebrow">People · Projects · Progress</p>
    <h1>Welcome back</h1>
    <p class="intro">Sign in to continue to your workspace. We’ll take you to the right portal.</p>
    <form id="signin-form">
      <label for="email">Organization email</label>
      <input id="email" name="email" type="email" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button id="signin-submit" type="submit">Sign in</button>
      <p id="signin-error" role="alert" aria-live="polite"></p>
    </form>
    <p class="help">Sign in with your organization email and password. Your account role determines which portal opens.</p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase.js"></script>
  <script>
    (() => {
      "use strict";

      const form = document.querySelector("#signin-form");
      const submit = document.querySelector("#signin-submit");
      const errorMessage = document.querySelector("#signin-error");

      function showError(message) {
        errorMessage.textContent = message;
      }

      if (!window.orbitSupabase?.auth) {
        showError("Authentication service could not be initialized. Check the Supabase configuration and network connection.");
        submit.disabled = true;
        return;
      }

      function openPortal(role) {
        const portal = role === "manager" ? "manager_IPT%20(1).html" : "emp_IPT%20(1).html";
        window.location.replace(`./${portal}`);
      }

      async function routeSession(session) {
        if (!session?.user) return false;

        const { data: profile, error } = await window.orbitSupabase
          .from("profiles")
          .select("role")
          .eq("id", session.user.id)
          .single();

        if (error) {
          console.error("Could not load the signed-in profile:", error);
          showError(error.code === "PGRST116"
            ? "No portal profile is linked to this account. Contact your Internal Project Tracker administrator."
            : `Could not load your profile: ${error.message}`);
          return false;
        }

        if (profile.role !== "manager" && profile.role !== "employee") {
          const { error: signOutError } = await window.orbitSupabase.auth.signOut();
          if (signOutError) {
            console.error("Could not sign out an account without a portal role:", signOutError);
          }
          showError("This account does not have access to an Internal Project Tracker portal.");
          return false;
        }

        openPortal(profile.role);
        return true;
      }

      const loginError = new URLSearchParams(window.location.search).get("error");
      if (loginError) {
        showError(loginError);
        window.history.replaceState(null, "", window.location.pathname);
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        submit.disabled = true;
        showError("");
        try {
          const { data, error } = await window.orbitSupabase.auth.signInWithPassword({
            email: document.querySelector("#email").value.trim(),
            password: document.querySelector("#password").value
          });
          if (error) throw error;
          await routeSession(data.session);
        } catch (error) {
          console.error("Supabase sign in failed:", error);
          showError(`Sign in failed: ${error.message}`);
        } finally {
          submit.disabled = false;
        }
      });

      window.orbitSupabase.auth.getSession().then(async ({ data, error }) => {
        if (error) throw error;
        await routeSession(data.session);
      }).catch((error) => {
        console.error("Could not restore the Supabase session:", error);
        showError(`Could not restore your session: ${error.message}`);
      });
    })();
  </script>
</body>
</html>
